[workspace]
resolver = "2"
members = [
    "crates/ledgerkit-core",
    "crates/ledgerkit-store",
    "crates/ledgerkit-import",
    "crates/ledgerkit-export",
    "crates/ledgerkit-cli",
    "plugins/sample-adapter",
]
default-members = ["crates/ledgerkit-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/PLACEHOLDER/ledgerkit"
authors = ["LedgerKit Contributors"]
rust-version = "1.75"

[workspace.dependencies]
ledgerkit-core = { path = "crates/ledgerkit-core" }
ledgerkit-store = { path = "crates/ledgerkit-store" }
ledgerkit-import = { path = "crates/ledgerkit-import" }
ledgerkit-export = { path = "crates/ledgerkit-export" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v7", "serde"] }
csv = "1"
regex = "1"
proptest = "1"
tempfile = "3"
pretty_assertions = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
